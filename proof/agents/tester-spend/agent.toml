description = "PROOF live tester, SPEND tier: may arm money-bearing platform action. Holds a machine-exec Fly token whose allowlist includes the arming verbs; the AMOUNT is bounded by a production fence, never by this token."
scope = "rig"
provider = "codex"

# CREDENTIAL TIER — verified 2026-09-21 against the live fleet.
#
# Same token shape as the `mutate` tier, with the arming verbs added to the
# allowlist. Create it the same way, with -a, at least one -p, and an explicit
# -x; both flyctl defaults are traps (see `agents/tester-mutate/agent.toml`).
#
# THIS TOKEN DOES NOT BOUND SPEND, and must never be described as though it
# does. PROOF's control plane buys capacity as principal from its own treasury
# and the signing key is in the deployed service, not here. Every money-bearing
# step a live test performs ARMS the platform — budget-activate, a coverage
# budget digest secret, enabling a controller — after which the platform spends
# asynchronously on its own schedule. A credential can bound what is armed; the
# AMOUNT is bounded only by the production fence that ADR-0151 clause 3 requires
# preflight to resolve, and a target with no such fence is not admissible here.
#
# The token is NOT set here — see the note in `agents/tester-observe/agent.toml`.

# The prompt is SHARED by all three tier agents and lives at
# `assets/prompts/tester.md`. An explicit relative path resolves against
# the PACK ROOT, and a path that does not exist makes Gas City start the agent
# with NO prompt at all, silently. The `worker-isolation` doctor check fails
# when this path does not resolve; verify any change with
#   gc prime <rig>/proof.tester-observe
prompt_template = "assets/prompts/tester.md"

# One conversation per live test. A live test is a sequence of readings whose
# meaning depends on the ones before it; restarting the conversation per bead
# would discard the run's own context.
wake_mode = "resume"

# Owner, 2026-09-22: Opus 5.5 at the same xhigh effort, so the personal default cannot leak in.
# Owner, 2026-09-27: the city is back on Claude Code after one day on Codex
# (GPT-6 Sol), and every role runs Opus 5.5 at high effort. The notes above
# record the earlier per-role pins this replaced.
# Owner, 2026-10-07: replace Grok with GPT-6.1 Sol at high effort.
# The city declares the exact Codex model choice.
option_defaults = { model = "gpt-6.1-sol", effort = "high" }

# One live test runs at a time across the whole fleet (ADR-0151 clause 5), so a
# tier agent never needs more than one session. The fleet-wide slot is enforced
# by the dispatcher; this cap makes a single tier's own over-scheduling
# impossible as well.
max_active_sessions = 1
min_active_sessions = 0
idle_timeout = "1h"

default_sling_formula = "mol-proof-livetest"

pre_start = [
  "{{.CityRoot}}/packs/proof/assets/scripts/prestart-guard.sh \"{{.RigRoot}}\" \"{{.CityRoot}}\"",
]

# [env] MUST be last: in TOML every key after a table header belongs to that
# table, and with this block placed earlier the scalars above silently became
# `env.option_defaults`, `env.wake_mode` and so on. `gc lint` catches it; a
# plain TOML parse does not, because the result is valid TOML and wrong.
[env]
CLAUDE_CODE_DISABLE_AUTO_MEMORY = "1"
LISKOV_LIVETEST_EXERCISE = "spend"
